[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggotaiorder"
version = "0.1.0"
description = "ggotAIorder 백엔드 Windows Service 엔진"
requires-python = ">=3.11"
# 런타임 의존성 — src/ggotaiorder 의 실제 import 기준. 버전은 검증된 venv 하한.
dependencies = [
    "google-genai>=2.7.0",       # pipeline.extractor (Gemini 구조화 추출)
    "supabase>=2.30.1",          # core.supabase_client
    "python-dotenv>=1.2.2",      # config (.env 로딩)
    "cryptography>=48.0.0",      # core.crypto (AES-256-CBC)
    "pydantic>=2.13.4",          # pipeline.models 등 데이터 모델
    "openpyxl>=3.1.5",           # rpa.backup (.xlsx 영수증)
    "faster-whisper>=1.2.1",     # pipeline.stt (한국어 STT)
    "fastapi>=0.136.3",          # api.routes (인입 Webhook)
    "python-multipart>=0.0.30",  # fastapi Form/multipart 엔드포인트(인입 webhook)
    "uvicorn>=0.48.0",           # api 서버 구동
    "httpx>=0.28.1",             # notifier.provider (알림톡 HTTP 발송)
    "bcrypt>=4.0.0",             # mall.smartstore_client 네이버 커머스API 전자서명(HMAC 아님, bcrypt)
    "APScheduler>=3.11.2",       # orchestrator (인트라넷 정기 폴링)
    "pystray>=0.19.5",           # tray (트레이 아이콘)
    "Pillow>=12.2.0",            # pystray 아이콘 이미지
    "pywin32>=311; sys_platform == 'win32'",  # service (Windows 서비스)
]

[project.optional-dependencies]
# 테스트 도구 — `pip install -e .[test]` 로 설치.
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",     # asyncio_mode=auto (async 테스트)
]

# 관리 프로그램별 자동입력(RPA) 의존성.
# 꽃집 한 곳은 프로그램을 하나만 쓰는데(FlowerNT | RoseWeb | 기타), 이걸 필수
# 의존성으로 두면 안 쓰는 쪽 런타임까지 모든 가게에 깔리고, 그중 하나라도 설치가
# 깨지면(예: greenlet 이 msvcp140.dll 을 못 찾던 건) 그 가게 자동입력이 죽는다.
# 어댑터가 호출 시점에 import 하므로 미설치여도 수집엔진은 정상 기동하고,
# 해당 주문은 백업(manual) 경로로 흐른다(singleton_macro).
flowernt = [
    "playwright>=1.60.0",        # rpa.flowernt3 (웹 관리 프로그램 — CDP 자동입력)
    "greenlet>=3.1.1,<3.5",      # playwright sync API 의존 — 3.5.x는 이 환경서 DLL 로드 실패
]
roseweb = [
    "uiautomation>=2.0.29",      # rpa.roseweb (데스크톱 앱 — Windows UI Automation)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
